<section id="cta-container">
  <div class="cta-bg-decoration">
    <div class="cta-glow"></div>
  </div>

  <div class="cta-inner">

    <div class="cta-top-line"></div>

    <div class="cta-content">
      <span class="cta-label">MULAI SEKARANG</span>

      <h2 class="cta-heading">
        <span class="cta-heading-line">Siap</span>
        <span class="cta-heading-line italic">Bersinar?</span>
      </h2>

      <p class="cta-subtext">Kirimkan sepatumu. Kembalikan seperti baru.</p>

      <div class="cta-divider">
        <span class="cta-divider-line"></span>
        <span class="cta-divider-diamond">✦</span>
        <span class="cta-divider-line"></span>
      </div>

      <div class="cta-actions">
        <div class="cta-buttons" id="cta-buttons">
          <button class="cta-btn-secondary" id="btn-basic">
            <span>Pesan Basic Clean</span>
            <span class="btn-price">Rp 35.000+</span>
          </button>
          <button class="cta-btn-primary" id="btn-deep">
            <span>Pesan Deep Clean</span>
            <span class="btn-price">Rp 75.000+</span>
          </button>
        </div>

        <div class="cta-form" id="cta-form">
          <div class="cta-form-inner">
            <div class="cta-service-badges">
              <span class="cta-badge" id="badge-basic">Basic Clean</span>
              <span class="cta-badge active" id="badge-deep">Deep Clean</span>
            </div>
            <div class="cta-form-row">
              <div class="cta-field">
                <input type="text" id="cta-name" placeholder="Nama Lengkap" />
              </div>
              <div class="cta-field">
                <input type="tel" id="cta-phone" placeholder="Nomor WhatsApp" />
              </div>
            </div>
            <div class="cta-field full">
              <input type="text" id="cta-shoe" placeholder="Jenis Sepatu (contoh: Nike Air Force 1)" />
            </div>
            <div class="cta-field full">
              <textarea id="cta-note" placeholder="Catatan tambahan (opsional)" rows="2"></textarea>
            </div>
            <div class="cta-form-footer">
              <button class="cta-submit" id="cta-submit">Kirim via WhatsApp →</button>
              <button class="cta-cancel" id="cta-cancel">Batal</button>
            </div>
          </div>
        </div>
      </div>

      <div class="cta-trust">
        <span class="cta-trust-item">✦ Respons cepat</span>
        <span class="cta-trust-sep">·</span>
        <span class="cta-trust-item">✦ Hasil terjamin</span>
        <span class="cta-trust-sep">·</span>
        <span class="cta-trust-item">✦ Dikemas dengan teliti</span>
      </div>
    </div>

    <div class="cta-bottom-line"></div>

  </div>
</section>
